    <script>
      // Ensure window.fetch has both getter and setter for browser extensions and test runners
      try {
        let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(newFetch) {
            _fetch = newFetch;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Safe fallback
      }
    </script>
